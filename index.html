<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("dbeat.theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>dbeat</title>
<style>
/* Colour coding lives here. Add a new state = add one variable + one entry in HEALTH (script). */
:root{
  --bg:#eceff6; --card:#fff; --text:#14161f; --muted:#7b8091; --line:rgba(30,40,90,.09);
  --fill:rgba(70,80,140,.085); --thumb:#fff; --glass:rgba(244,246,252,.74);
  --accent:#3d6ae5; --accent-soft:color-mix(in srgb,var(--accent) 12%,transparent);
  --ok:#34c759; --soon:#ff9f0a; --bad:#ff3b30; --maint:#af52de; --idle:#8e93a3; --go:#3d6ae5; --wait:#5e5ce6; --earn:#30b0c7; --empty:#a2845e; --contract:#e0508f;
  --shadow:0 0 0 .5px rgba(30,40,90,.05),0 2px 6px rgba(30,40,90,.04),0 16px 40px rgba(30,40,90,.06);
  --shadow-up:0 0 0 .5px rgba(0,0,0,.06),0 4px 10px rgba(0,0,0,.06),0 24px 48px rgba(0,0,0,.09);
  --radius:24px; --ease:cubic-bezier(.2,.8,.2,1);
  font-family:"Figtree","Noto Sans Devanagari",-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI Variable Display","Segoe UI Variable","Segoe UI",Inter,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d12;--card:#171a22;--text:#f3f4f8;--muted:#9096a8;--line:rgba(255,255,255,.1);--fill:rgba(150,160,210,.16);--thumb:#3a3f52;--glass:rgba(23,26,34,.74);
    --accent:#7292ff;--ok:#30d158;--soon:#ff9f0a;--bad:#ff453a;--maint:#bf5af2;--go:#7292ff;--wait:#8f8cff;--earn:#40c8e0;--empty:#ac8e68;--contract:#ff6bb5;
    --shadow:0 0 0 .5px rgba(255,255,255,.08);--shadow-up:0 0 0 .5px rgba(255,255,255,.14),0 20px 40px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d12;--card:#171a22;--text:#f3f4f8;--muted:#9096a8;--line:rgba(255,255,255,.1);--fill:rgba(150,160,210,.16);--thumb:#3a3f52;--glass:rgba(23,26,34,.74);
    --accent:#7292ff;--ok:#30d158;--soon:#ff9f0a;--bad:#ff453a;--maint:#bf5af2;--go:#7292ff;--wait:#8f8cff;--earn:#40c8e0;--empty:#ac8e68;--contract:#ff6bb5;
    --shadow:0 0 0 .5px rgba(255,255,255,.08);--shadow-up:0 0 0 .5px rgba(255,255,255,.14),0 20px 40px rgba(0,0,0,.5);color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{scrollbar-width:thin}
body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.35;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{-webkit-tap-highlight-color:transparent}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
aside{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:28px 12px;background:var(--glass);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-right:.5px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;font-weight:600;font-size:17px;letter-spacing:-.02em;padding:0 10px 26px}
.logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#8aa6ff,#3d6ae5 70%);box-shadow:0 2px 6px rgba(61,106,229,.35)}
.logo svg{width:16px;height:16px;stroke-width:2.4}
nav button{display:flex;gap:11px;align-items:center;width:100%;border:0;background:none;padding:9px 14px;border-radius:980px;cursor:pointer;color:var(--text);font-weight:500;font-size:14.5px;margin-bottom:2px;transition:background .2s}
nav button svg{color:var(--accent);width:19px;height:19px}
nav button:hover{background:var(--fill)}
nav button.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:600}
main{padding:44px clamp(18px,4.5vw,64px) 90px;max-width:1280px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:30px}
h1{font-size:34px;letter-spacing:-.045em;margin:0;font-weight:700;line-height:1.1}
.sub{color:var(--muted);margin-top:6px;font-size:15px;letter-spacing:-.01em}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:980px;padding:8px 17px;background:var(--accent);color:#fff;font-weight:500;font-size:14.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;transition:transform .2s var(--ease),filter .2s,background .2s}
.btn svg{width:15px;height:15px;stroke-width:2.4}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.btn.sm{padding:5px 13px;font-size:13px}
.icon-btn{border:0;background:var(--fill);color:var(--text);width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:transform .2s var(--ease),background .2s}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:17px;height:17px}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:1px}
.seg button{border:0;background:none;padding:5px 16px;border-radius:7px;cursor:pointer;font-weight:500;font-size:13.5px;color:var(--text);transition:background .25s var(--ease),box-shadow .25s}
.seg button.on{background:var(--thumb);box-shadow:0 .5px 1px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.1)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.meta{color:var(--muted);font-size:13px}
.nick{color:var(--muted);font-weight:500}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin:-10px 0 20px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.vcard{padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:16px;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.vcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-up)}
.vcard:active{transform:scale(.985)}
.vtop{display:flex;justify-content:space-between;gap:8px 10px;align-items:flex-start;flex-wrap:wrap}
.vtop .pill{margin-left:auto}
.vtop b{font-size:17px;letter-spacing:-.025em;font-weight:600}
.vstate{display:flex;flex-direction:column;gap:2px;min-height:50px;padding:12px 14px;border-radius:14px;background:var(--fill)}
.vstate.earn{background:color-mix(in srgb,var(--earn) 13%,transparent)}
.vstate.empty{background:color-mix(in srgb,var(--empty) 14%,transparent)}
.vstate.maint{background:color-mix(in srgb,var(--maint) 12%,transparent)}
.vstate.idle{background:color-mix(in srgb,var(--ok) 9%,transparent)}
.vstate .big{display:flex;gap:8px;align-items:center;font-weight:600;font-size:15px;letter-spacing:-.015em}
.vstate.maint .big{color:var(--maint)}
.vstate small{color:var(--muted);font-size:12.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{--c:var(--idle);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--text));flex:none}
.vstate .big{flex-wrap:wrap}
.paprow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 20px;flex-wrap:wrap}
.paprow+.paprow{border-top:.5px solid var(--line)}
.paprow .l{display:flex;flex-direction:column;gap:3px;min-width:0}
.paprow .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.count{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 8px;border-radius:980px;background:var(--fill);font-size:13px;font-weight:600;vertical-align:middle;margin-left:10px;color:var(--muted);letter-spacing:0}
.procrow{display:grid;grid-template-columns:1fr 150px;gap:12px;align-items:center;margin-bottom:8px}
.procrow input[type=date]{margin-top:0}
.vfoot{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fuelwrap{display:flex;align-items:center;gap:9px;min-width:120px;flex:1;max-width:200px}
.fuel{display:block;flex:1;height:6px;border-radius:9px;background:var(--fill);overflow:hidden}
.fuel i{display:block;height:100%;border-radius:9px;transition:width .6s var(--ease)}
.fuelwrap em{font-style:normal;font-size:12px;color:var(--muted);min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
.seats{display:inline-flex;gap:5px;align-items:center;color:var(--muted);font-size:13px;white-space:nowrap}.seats svg{width:15px;height:15px}
.pill{--c:var(--idle);display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:980px;font-size:12px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 72%,var(--text))}
.section{margin:30px 0 12px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:-.005em}
main .section{font-size:22px;color:var(--text);letter-spacing:-.03em;margin:44px 0 14px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;transition:background .2s}
.row+.row{border-top:.5px solid var(--line)}
.row:hover{background:var(--fill)}
.row:first-child{border-radius:var(--radius) var(--radius) 0 0}.row:last-child{border-radius:0 0 var(--radius) var(--radius)}.row:only-child{border-radius:var(--radius)}
.tl{overflow-x:auto}.tl-inner{min-width:980px;position:relative}
.tl-row{display:grid;grid-template-columns:200px 1fr;border-top:.5px solid var(--line);min-height:72px}
.tl-row.top{border-top:0;min-height:36px}
.tl-who{padding:12px 18px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.tl-who b{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;letter-spacing:-.015em}
.tl-track{position:relative;cursor:copy;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/16 - .5px),var(--line) calc(100%/16 - .5px),var(--line) calc(100%/16))}
.tl-track.maint{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--maint) 12%,transparent) 0 10px,transparent 10px 20px);cursor:not-allowed}
.tl-hours{display:grid;grid-template-columns:repeat(16,1fr);font-size:11px;color:var(--muted)}
.tl-hours span{padding:11px 0 0 7px}
.tl-now{position:absolute;top:30px;bottom:0;width:1.5px;background:var(--bad);pointer-events:none;z-index:2}
.tl-now::before{content:"";position:absolute;top:-4px;left:-3.5px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
.blk{--c:var(--go);position:absolute;top:10px;bottom:10px;border-radius:9px;padding:6px 10px;font-size:12px;overflow:hidden;cursor:pointer;border:0;border-left:3px solid var(--c);text-align:left;background:color-mix(in srgb,var(--c) 16%,var(--card));color:color-mix(in srgb,var(--c) 78%,var(--text));transition:transform .25s var(--ease),box-shadow .25s}
.blk:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.blk b{display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-weight:600}
.cdot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--contract)}
.blk.earn{--c:var(--earn)}.blk.empty{--c:var(--empty)}.blk.done{--c:var(--ok)}.blk.cancelled{--c:var(--idle);opacity:.6}
.nov{padding:15px 20px;display:flex;gap:12px;justify-content:space-between;align-items:center;cursor:pointer;transition:background .2s}
.nov+.nov{border-top:.5px solid var(--line)}
.nov:hover{background:var(--fill)}
.empty{color:var(--muted);text-align:center;padding:40px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{border:0;background:var(--fill);padding:6px 15px;border-radius:980px;cursor:pointer;color:var(--text);font-weight:500;font-size:14px;transition:background .25s,color .25s,transform .2s var(--ease)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--text);color:var(--bg)}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(160deg,#b0b3bb,#7d808a);color:#fff;display:grid;place-items:center;font-weight:600;font-size:17px;flex:none}
dialog{border:0;border-radius:28px;padding:0;width:min(580px,94vw);max-height:92vh;overflow:auto;background:var(--card);color:var(--text);box-shadow:0 0 0 .5px var(--line),0 40px 100px rgba(0,0,0,.35)}
dialog[open]{animation:sheet .42s var(--ease)}
dialog::backdrop{background:rgba(0,0,0,.3);backdrop-filter:blur(12px) saturate(120%);-webkit-backdrop-filter:blur(12px)}
dialog[open]::backdrop{animation:fade .3s ease}
.dlg{padding:30px}
.dlg h2{margin:0 0 20px;font-size:24px;letter-spacing:-.035em;font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
label{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:14px}
label[hidden]{display:none}
input:not([type=checkbox]):not([type=range]),select,textarea{display:block;width:100%;margin-top:6px;padding:11px 14px;border-radius:12px;border:0;background:var(--fill);font-size:15.5px;color:var(--text);transition:box-shadow .2s,background .2s}
select option,select optgroup{background-color:var(--card);color:var(--text)}
input[type=range]{width:100%;margin-top:10px;accent-color:var(--accent)}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent)}
input:focus,select:focus,textarea:focus{outline:0;box-shadow:0 0 0 3.5px color-mix(in srgb,var(--accent) 35%,transparent)}
.check{display:flex;gap:11px;align-items:center;color:var(--text);font-size:15px;font-weight:400}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
.actions .btn:not(.sm){flex:1;padding:13px 18px;font-size:15.5px;border-radius:14px}
.warn{background:color-mix(in srgb,var(--soon) 14%,transparent);color:color-mix(in srgb,var(--soon) 60%,var(--text));border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:13.5px}
.vpick{display:grid;gap:8px;margin-bottom:16px}
.vopt{display:grid;gap:6px;text-align:left;border:0;background:var(--fill);border-radius:14px;padding:12px 14px;cursor:pointer;transition:box-shadow .25s,background .25s,transform .2s var(--ease)}
.vopt:active{transform:scale(.985)}
.vopt.sel{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.vopt .top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.vopt .meta{margin-left:6px;font-weight:400}
.why{font-size:12.5px}.why.good{color:var(--ok)}.why.no{color:var(--bad)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;margin:0 0 20px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.docline{display:flex;gap:9px;align-items:center}
@keyframes sheet{from{opacity:0;transform:translateY(18px) scale(.965)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.enter>*{animation:rise .6s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}
.enter .grid>*{animation:rise .6s var(--ease) both}
.enter .grid>*:nth-child(2){animation-delay:.04s}.enter .grid>*:nth-child(3){animation-delay:.08s}.enter .grid>*:nth-child(4){animation-delay:.12s}.enter .grid>*:nth-child(5){animation-delay:.16s}.enter .grid>*:nth-child(6){animation-delay:.2s}.enter .grid>*:nth-child(n+7){animation-delay:.24s}
.hero{text-align:center;margin:4px auto 24px;max-width:680px}
.hero h1{font-size:clamp(30px,5.4vw,46px);letter-spacing:-.045em;line-height:1.06;font-weight:700;text-wrap:balance}
.hero .sub{margin-top:12px;font-size:16px}
.chiprow{display:flex;gap:10px;overflow-x:auto;padding:4px 3px 10px;margin:0 -3px 8px;justify-content:safe center;align-items:center;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.pchip{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;background:var(--card);box-shadow:var(--shadow);color:var(--text);padding:10px 18px;border-radius:980px;font-weight:600;font-size:15px;cursor:pointer;transition:transform .2s var(--ease),box-shadow .25s,color .25s}
.pchip b{color:var(--muted);font-weight:600}
.pchip:active{transform:scale(.96)}
.pchip.sel{box-shadow:inset 0 0 0 2px var(--accent),var(--shadow);color:var(--accent)}
.pchip.sel b{color:var(--accent)}
.bar{display:flex;gap:12px;justify-content:center;align-items:center;margin:6px 0 22px;flex-wrap:wrap}
.vstate.earn,.vstate.empty,.vstate.maint,.vstate.idle{background:none}
.vstate{padding:0;min-height:0;gap:6px}
.vstate .big{flex-direction:column;align-items:flex-start;gap:8px;font-size:22px;font-weight:700;letter-spacing:-.04em;line-height:1.12}
.vstate.idle .big{color:var(--muted)}
.vstate small{font-size:14px;line-height:1.35}
.btns{margin-top:0}
.btns .btn{flex:1;padding:13px 14px;font-size:15.5px;border-radius:16px}
.btn.outline{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.cta{width:100%;padding:16px 18px;font-size:17px;border-radius:18px}
.ctas{display:grid;gap:10px}
.sheet-head{text-align:center;margin-bottom:14px}
.sheet-head h2{margin:12px 0 6px;font-size:30px;letter-spacing:-.045em}
.route{background:var(--fill);border-radius:20px;padding:6px 18px;margin-bottom:18px}
.stop{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;position:relative;padding:14px 0}
.stop:first-child::after{content:"";position:absolute;left:10px;top:36px;bottom:-12px;width:2px;background:var(--text);opacity:.85}
.stop .mk{width:12px;height:12px;border-radius:50%;margin:0 auto;position:relative;z-index:1}
.stop .mk.dot{background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.stop .mk.pin{background:var(--text)}
.stop b{display:block;font-size:16px;letter-spacing:-.02em}
.stop time{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.iconrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin:4px 0 16px;border-top:.5px solid var(--line);padding-top:12px}
.ib{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 4px;border-radius:14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);transition:background .2s,transform .2s var(--ease)}
.ib svg{width:22px;height:22px}
.ib:hover{background:var(--fill)}
.ib:active{transform:scale(.94)}
.ib.red{color:var(--bad)}
.lang{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:20;background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--shadow)}
.lang button{padding:6px 14px}
.app[hidden]{display:none}
.themeseg{margin-top:auto;align-self:flex-start;margin-left:6px}
.themeseg button{padding:6px 14px;display:flex;align-items:center}
.themeseg svg{width:17px;height:17px}
#auth{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
#auth[hidden]{display:none}
.authbox{width:min(400px,100%);padding:30px 26px}
.authbox .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:-.03em;margin-bottom:18px}
.authbox h1{margin:0 0 4px;font-size:28px;letter-spacing:-.045em}

function nick(id) {

const level = (issues, extra) => { const has = l => issues.some(i => i.lvl === l); return extra && has(extra) ? extra : has('bad') ? 'bad' : has('soon') ? 'soon' : has('wait') ? 'wait' : 'ok'; };
function health(v) {
  const issues = [];
  if (v.maintenance) issues.push({ lvl: 'maint', text: 'In maintenance' });
  for (const [k, label] of DOCS) {
    const d = v.docs?.[k], st = v.docState?.[k], proc = !!st?.inProcess;
    let base = '', block = false;
    if (!d) { base = `${label} missing`; block = true; }
    else { const n = daysUntil(d); if (n < 0) { base = `${label} expired`; block = true; } else if (n <= 30) base = `${label} ends in ${n} days`; }
    if (base) issues.push({ lvl: proc ? 'wait' : block ? 'bad' : 'soon', block, doc: k, base, proc, exp: st?.expected || '', text: base + (proc ? ` · renewal in progress${st?.expected ? ', expected ' + st.expected : ''}` : '') });

}
function driverHealth(d) {

  else { const n = daysUntil(d.licenseExpiry); if (n < 0) issues.push({ lvl: 'bad', text: 'License expired' }); else if (n <= 30) issues.push({ lvl: 'soon', text: `License ends in ${n} days` }); }
  if (!d.idChecked) issues.push({ lvl: 'soon', text: 'ID not checked' });
  if (!d.homeAddress) issues.push({ lvl: 'soon', text: 'Home address missing' });

}

/* ---- Trip rules ---- */
function overlaps(a, b) { return a.date === b.date && mins(a.start) < mins(b.end) && mins(b.start) < mins(a.end); }
const busy = (trip, key, id) => db.appts.some(o => o.id !== trip.id && o.status !== 'cancelled' && o[key] === id && overlaps(trip, o));
function fitReasons(v, trip) {
  const r = [], k = kindOf(v);
  health(v).issues.filter(i => i.lvl === 'maint' || i.block).forEach(i => r.push(i.text));
  if (trip.kind === 'cargo') {
    if (k !== 'cargo') r.push('Carries people, not cargo');
    else if (trip.cargoKg && v.capacity < trip.cargoKg) r.push(`Carries up to ${v.capacity} kg (need ${trip.cargoKg})`);
  } else {
    if (k === 'cargo') r.push('Cargo vehicle, no seats');
    else if (trip.passengers && v.seats < trip.passengers) r.push(`Only ${v.seats} seats (need ${trip.passengers})`);
  }
  const reach = v.fuel / 100 * v.range;
  if (trip.distance && reach < trip.distance) r.push(`Fuel for ~${Math.round(reach)} km (trip ${trip.distance} km)`);
  if (busy(trip, 'vehicleId', v.id)) r.push('Already booked then');
  return r;
}
function problems(trip) {
  const out = [], d = driver(trip.driverId);
  if (d) {
    if (busy(trip, 'driverId', d.id)) out.push(`${d.name} is already booked then`);
    driverHealth(d).issues.filter(i => i.lvl === 'bad').forEach(i => out.push(`${d.name}: ${i.text}`));

}

const tripMode = a => a.revenue === false || a.phase !== 'loaded' ? 'empty' : 'earn';

}

function vehicleDocItems() {

const trp = x => hiPhrase(x) ?? x;
const PAT = [
  [/^(\d+) earning, (\d+) running empty$/, m => `${m[1]} कमाई पर, ${m[2]} खाली चल रही`],
  [/^(\d+) trips? planned$/, m => `${m[1]} ट्रिप तय`],
  [/^(\d+) hire contracts? pending$/, m => `${m[1]} किराया अनुबंध बाकी`],

  [/^(\d+) in your fleet$/, m => `आपकी गाड़ियाँ: ${m[1]}`],
  [/^(\d+) working$/, m => `${m[1]} काम पर`],
  [/^(\d+) trips?$/, m => `${m[1]} ट्रिप`],
  [/^(\d+) people on board$/, m => `${m[1]} सवारी सवार`],
  [/^(\d+) people$/, m => `${m[1]} सवारी`],
  [/^([\d,]+) kg cargo on board$/, m => `${m[1]} किग्रा सामान लदा`],
  [/^([\d,]+) kg cargo$/, m => `${m[1]} किग्रा सामान`],
  [/^([\d,]+) kg load$/, m => `${m[1]} किग्रा भार`],
  [/^([\d,]+) kg$/, m => `${m[1]} किग्रा`],
  [/^(\d+) seats?$/, m => `${m[1]} सीट`],
  [/^(\d+) km$/, m => `${m[1]} किमी`],
  [/^About (\d+) km left$/, m => `लगभग ${m[1]} किमी बाकी`],
  [/^Fuel (\d+)%$/, m => `ईंधन ${m[1]}%`],
  [/^Fuel for ~(\d+) km \(trip (\d+) km\)$/, m => `ईंधन ~${m[1]} किमी के लिए (ट्रिप ${m[2]} किमी)`],
  [/^Only (\d+) seats \(need (\d+)\)$/, m => `सिर्फ़ ${m[1]} सीट (ज़रूरत ${m[2]})`],
  [/^Carries up to ([\d,]+) kg \(need ([\d,]+)\)$/, m => `${m[1]} किग्रा तक ले जा सकती है (ज़रूरत ${m[2]})`],
  [/^Next: (.+)$/, m => `अगली: ${m[1]}`],
  [/^First: (.+)$/, m => `पहली: ${m[1]}`],
  [/^Until (\S+)$/, m => `${m[1]} तक`],
  [/^Valid until (\S+)$/, m => `${m[1]} तक मान्य`],
  [/^Expired (\d+) days ago$/, m => `${m[1]} दिन पहले खत्म`],
  [/^expected (\S+)$/, m => `अपेक्षित ${m[1]}`],
  [/^[Rr]enewal in progress, expected (\S+)$/, m => `नवीनीकरण जारी, अपेक्षित ${m[1]}`],
  [/^Original checked on (\S+)$/, m => `मूल पहचान पत्र जाँचा गया: ${m[1]}`],
  [/^(Insurance|Registration|Inspection) expired$/, m => `${DOCW[m[1]]} की अवधि खत्म`],
  [/^(Insurance|Registration|Inspection) missing$/, m => `${DOCW[m[1]]} नहीं है`],
  [/^(Insurance|Registration|Inspection) ends in (\d+) days$/, m => `${DOCW[m[1]]} ${m[2]} दिन में खत्म`],
  [/^(Insurance|Registration|Inspection) renewal in progress$/, m => `${DOCW[m[1]]} का नवीनीकरण जारी`],
  [/^License ends in (\d+) days$/, m => `लाइसेंस ${m[1]} दिन में खत्म`],
  [/^Hire contract with (.+)$/, m => `${m[1]} के साथ किराया अनुबंध`],
  [/^(.+) \(hire contract pending\)$/, m => `${trp(m[1])} (किराया अनुबंध बाकी)`],
  [/^(.+) is already booked then$/, m => `${m[1]} उस समय पहले से बुक है`],
  [/^(.+) \((people|cargo)\)$/, m => `${trp(m[1])} (${m[2] === 'people' ? 'सवारी' : 'सामान'})`],
  [/^class (.+)$/, m => `श्रेणी ${m[1]}`],
  [/^(Sedan|SUV|Van|Minibus|Truck) (\d+)$/, m => `${trp(m[1])} ${m[2]}`],
  [/^Earning (\d+) min$/, m => `कमाई ${m[1]} मिनट`],
  [/^Earning (\d+) h (\d+) min$/, m => `कमाई ${m[1]} घंटा ${m[2]} मिनट`],
  [/^Empty (\d+) min$/, m => `खाली ${m[1]} मिनट`],
  [/^Empty (\d+) h (\d+) min$/, m => `खाली ${m[1]} घंटा ${m[2]} मिनट`],
  [/^Cannot delete: (\d+) vehicle\(s\) use this type\.$/, m => `हटा नहीं सकते: ${m[1]} वाहन इस प्रकार के हैं।`],
  [/^(.+) \(([a-z ,]+)\)$/, m => { const parts = m[2].split(', ').map(hiPhrase); return parts.every(Boolean) ? `${m[1]} (${parts.join(', ')})` : null; }],

function hiPhrase(s) {
  if (Object.hasOwn(HI, s)) return HI[s];
  for (const [re, fn] of PAT) { const m = s.match(re); if (m) { const r = fn(m); if (r) return r; } }
  const i = s.indexOf(': ');
  if (i > 0) { const r = hiPhrase(s.slice(i + 2)); if (r) return trp(s.slice(0, i)) + ': ' + r; }
  return null;
}
function hiText(s) {
  const core = s.trim(); if (!core) return s;
  const lead = s.slice(0, s.indexOf(core)), tail = s.slice(lead.length + core.length);
  return lead + core.split(' · ').map(p => hiPhrase(p) ?? p).join(' · ') + tail;
}
function hiNode(root) {
  if (root.nodeType === 3) { if (root.parentNode?.tagName !== 'TEXTAREA') root.nodeValue = hiText(root.nodeValue); return; }
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = [];
  for (let n; (n = w.nextNode());) list.push(n);
  list.forEach(n => { if (!['SCRIPT', 'STYLE', 'TEXTAREA'].includes(n.parentNode.tagName)) { const v = hiText(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; } });
  [root, ...root.querySelectorAll('[placeholder],[title],[aria-label]')].forEach(e => ['placeholder', 'title', 'aria-label'].forEach(a => {
    const v = e.getAttribute(a); if (v) { const x = hiText(v); if (x !== v) e.setAttribute(a, x); }
  }));
}
function setLang(l) {
  lang = l === 'hi' ? 'hi' : 'en';
  try { localStorage.setItem('dbeat.lang', lang); } catch {}
  document.documentElement.lang = lang; track('language_' + lang); try { if (window.clarity) window.clarity('set', 'language', lang); } catch {}
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  close(); render();
  if (landing && !landing.hidden) { const pre = landing.classList.contains('pre'); showLanding(); if (pre) landing.classList.add('pre'); } else if (authEl && !authEl.hidden) showAuth(authMode);
}
new MutationObserver(ms => { if (lang === 'hi') ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1 || n.nodeType === 3) hiNode(n); })); }).observe(document.body, { childList: true, subtree: true });

/* ---- Views ---- */
const NAV = [['schedule', 'Schedule'], ['drivers', 'Drivers'], ['vehicles', 'Vehicles']];
function render() {
  $('#nav').innerHTML = NAV.map(([k, l]) => `<button class="${view === k ? 'on' : ''}" data-go="${k}">${I[k]}${l}</button>`).join('');
  const m = $('#main'), key = view + mode + day;
  m.innerHTML = view === 'schedule' ? scheduleView() : view === 'drivers' ? driversView() : vehiclesView();
  if (key !== lastKey) { m.classList.remove('enter'); void m.offsetWidth; m.classList.add('enter'); lastKey = key; }
}
let lastKey = '';

function vehicleState(v) {
  const h = health(v);
  const trips = db.appts.filter(a => a.vehicleId === v.id && a.date === day && a.status !== 'cancelled').sort((a, b) => mins(a.start) - mins(b.start));
  if (h.level === 'maint') return { cls: 'maint', big: 'In maintenance', small: 'Not available' };
  if (day === today()) {
    const go = trips.find(a => a.status === 'dispatched');
    if (go) {
      const m = tripMode(go), ph = go.phase || 'pickup', cust = go.revenue !== false;
      const btns = (cust && ph === 'pickup' ? `<button class="btn" data-phase="loaded" data-id="${go.id}">Picked up</button>` : cust && ph === 'loaded' ? `<button class="btn" data-phase="return" data-id="${go.id}">Dropped off</button>` : '')
        + `<button class="btn outline" data-set="complete" data-id="${go.id}">End trip</button>`;
      return { cls: m, big: `<span class="tag" style="--c:var(${MODE[m].css})">${MODE[m].label}</span>${esc(go.address || go.title)}`, small: `${esc(driver(go.driverId)?.name || 'No driver')} · ${phaseText(go)}`, btns };
    }
    const next = trips.find(a => a.status === 'scheduled' && mins(a.start) >= nowMin());
    if (next) return { cls: 'idle', big: 'Parked', small: `Next: ${fmt(next.start)} · ${esc(next.title)}${next.hireDocs === 'waiting' ? ' · <span style="color:var(--contract)">hire contract pending</span>' : ''}` };
    return { cls: 'idle', big: 'Parked', small: 'No more trips today' };
  }
  return trips.length ? { cls: 'idle', big: `${trips.length} trip${trips.length > 1 ? 's' : ''}`, small: `First: ${fmt(trips[0].start)} · ${esc(trips[0].title)}` } : { cls: 'idle', big: 'Free', small: 'No trips' };
}

function scheduleView() {
  const fleet = db.vehicles.map(v => ({ v, h: health(v), s: vehicleState(v) }));
  const free = f => f.s.cls === 'idle' && f.h.level !== 'bad', attn = f => ['soon', 'bad', 'maint'].includes(f.h.level);
  const pick = { all: () => true, earn: f => f.s.cls === 'earn', empty: f => f.s.cls === 'empty', free, attn };
  const n = Object.fromEntries(Object.entries(pick).map(([k, fn]) => [k, fleet.filter(fn).length]));
  const trips = db.appts.filter(a => a.date === day && a.status !== 'cancelled').length;
  const contracts = contractItems().length, renewing = vehicleDocItems().filter(i => i.state === 'process').length;
  const headline = day === today() ? (n.earn || n.empty ? `${n.earn} earning, ${n.empty} running empty` : 'No vehicles on the road') : `${trips} trip${trips === 1 ? '' : 's'} planned`;
  const chips = [['all', 'All'], ['earn', 'Earning', '--earn'], ['empty', 'Empty run', '--empty'], ['free', 'Free', '--ok'], ['attn', 'Needs attention', '--soon']]
    .map(([k, l, c]) => `<button class="pchip ${ff === k ? 'sel' : ''}" data-ff="${k}">${c ? `<span class="dot" style="background:var(${c})"></span>` : ''}${l} <b>${n[k]}</b></button>`).join('');
  const days = Array.from({ length: 7 }, (_, i) => addDays(day, i - 3)).map(s => `<button class="pchip ${s === day ? 'sel' : ''}" data-setday="${s}">${s === today() ? 'Today' : new Date(s + 'T12:00').toLocaleDateString(LOC(), { weekday: 'short', day: 'numeric' })}</button>`).join('');
  const body = mode === 'fleet' ? fleetView(fleet.filter(pick[ff] || pick.all)) : planView();
  return `<div class="hero"><h1>${headline}</h1>
    <div class="sub">${nice(day)}${contracts ? ` · ${contracts} hire contract${contracts > 1 ? 's' : ''} pending` : ''}${renewing ? ` · ${renewing} vehicle renewal${renewing > 1 ? 's' : ''} in progress` : ''}</div></div>
  <div class="chiprow"><button class="icon-btn" data-day="-1" aria-label="Previous day">${I.left}</button>${days}<button class="icon-btn" data-day="1" aria-label="Next day">${I.right}</button></div>
  <div class="bar"><div class="seg"><button class="${mode === 'fleet' ? 'on' : ''}" data-mode="fleet">Fleet</button><button class="${mode === 'plan' ? 'on' : ''}" data-mode="plan">Plan</button></div>
    <button class="btn" data-new-trip>${I.plus}New trip</button></div>
  ${mode === 'fleet' ? `<div class="chiprow">${chips}</div>` : ''}${body}`;
}

function legend() { return `<div class="legend">${Object.entries(HEALTH).map(([k, h]) => `<span>${dot(k)}${h.label}</span>`).join('')}<span><span class="dot" style="background:var(${CONTRACT.css})"></span>${CONTRACT.label}</span>${Object.values(MODE).map(m => `<span><span class="dot" style="background:var(${m.css})"></span>${m.label}</span>`).join('')}</div>`; }

function fleetView(fleet) {
  const unassigned = db.appts.filter(a => a.date === day && !a.vehicleId && a.status !== 'cancelled');
  return `<div class="grid">${fleet.map(({ v, h, s }) => `<div class="card vcard" data-vehicle="${v.id}">
    <div class="vtop"><div><b>${vtag(v)}</b><div class="meta">${esc(typeName(v.typeId))} · ${esc(v.plate)}</div></div>${healthPill(h)}</div>
    <div class="vstate ${s.cls}"><div class="big">${s.big}</div><small>${s.small}</small></div>
    ${s.btns ? `<div class="btns">${s.btns}</div>` : ''}
    <div class="vfoot">${fuelBar(v.fuel)}${capLabel(v)}</div></div>`).join('') || '<div class="card empty">No vehicles match. Try another filter.</div>'}</div>
  ${unassigned.length ? `<div class="section">Trips without a vehicle</div><div class="card">${unassigned.map(a => `<div class="nov" data-open="${a.id}">
    <div><b>${esc(a.title)}</b><div class="meta">${fmt(a.start)}–${fmt(a.end)} · ${loadText(a)}</div></div><span class="btn ghost sm">Choose vehicle</span></div>`).join('')}</div>` : ''}${papersPanel()}`;
}

function blockHTML(a) {
  const left = Math.max(0, (mins(a.start) - DAY_START) / DAY_SPAN * 100);
  const width = Math.max(3, (Math.min(mins(a.end), DAY_START + DAY_SPAN) - Math.max(mins(a.start), DAY_START)) / DAY_SPAN * 100);
  return `<button class="blk ${a.status === 'dispatched' ? tripMode(a) : TRIPCLS[a.status]}" style="left:${left}%;width:${width}%" data-open="${a.id}" title="${esc(a.title)}${a.hireDocs === 'waiting' ? ' (hire contract pending)' : ''}">${a.hireDocs === 'waiting' ? '<i class="cdot"></i>' : ''}<b>${esc(a.title)}</b>${fmt(a.start)}–${fmt(a.end)}</button>`;
}
function planView() {
  const trips = db.appts.filter(a => a.date === day);
  const hours = Array.from({ length: 16 }, (_, i) => { const h = 6 + i; return `<span>${lang === 'hi' ? h : (h + 11) % 12 + 1}${lang === 'hi' ? '' : h < 12 ? 'a' : 'p'}</span>`; }).join('');
  const loose = trips.filter(a => !a.vehicleId);
  const nowPct = day === today() ? (nowMin() - DAY_START) / DAY_SPAN : -1;
  return `${legend()}<div class="card tl"><div class="tl-inner">
    ${nowPct > 0 && nowPct < 1 ? `<div class="tl-now" style="left:calc(200px + (100% - 200px) * ${nowPct})"></div>` : ''}
    <div class="tl-row top"><div></div><div class="tl-hours">${hours}</div></div>
    ${loose.length ? `<div class="tl-row"><div class="tl-who"><b>No vehicle yet</b></div><div class="tl-track" data-slot="">${loose.map(blockHTML).join('')}</div></div>` : ''}
    ${db.vehicles.map(v => { const h = health(v); return `<div class="tl-row"><div class="tl-who"><b>${dot(h.level)}${vtag(v)}</b>${fuelBar(v.fuel)}</div>
      <div class="tl-track ${h.level === 'maint' ? 'maint' : ''}" ${h.level === 'maint' ? '' : `data-slot="${v.id}"`}>${trips.filter(a => a.vehicleId === v.id).map(blockHTML).join('')}</div></div>`; }).join('')}
  </div></div><p class="meta" style="margin-top:12px">Click an empty spot to plan a trip for that vehicle.</p>`;
}

function driversView() {
  const go = d => db.appts.find(a => a.driverId === d.id && a.date === today() && a.status === 'dispatched');
  return `<div class="head"><div><h1>Drivers</h1><div class="sub">${db.drivers.filter(d => d.active).length} working</div></div><button class="btn" data-new-driver>${I.plus}Add driver</button></div>
  <div class="card">${db.drivers.map(d => { const h = driverHealth(d), i = h.issues[0], cars = db.vehicles.filter(v => v.driverId === d.id);
    return `<div class="row" data-driver="${d.id}"><div style="display:flex;gap:14px;align-items:center"><div class="avatar">${esc(d.name.trim()[0] || '?')}</div>
    <div><b>${esc(d.name)}</b> <span class="nick">“${esc(nick(d.id))}”</span><div class="meta">${cars.length ? esc(cars.map(c => c.name).join(', ')) + ' · ' : ''}${esc(d.phone)}${i ? ` · <span style="color:var(${HEALTH[i.lvl].css})">${esc(i.text)}</span>` : ''}</div></div></div>
    <span class="pill" style="--c:var(${!d.active ? '--idle' : go(d) ? tripColor(go(d)) : HEALTH[h.level].css})">${d.active ? (go(d) ? `<span class="dot" style="background:var(${tripColor(go(d))})"></span>${tripLabel(go(d))}` : `${dot(h.level)}${DRIVER_LABEL[h.level]}`) : `<span class="dot" style="background:var(--idle)"></span>Off`}</span></div>`; }).join('') || '<div class="empty">No drivers yet.</div>'}</div>`;
}

function vehiclesView() {
  const list = db.vehicles.filter(v => !typeFilter || v.typeId === typeFilter);
  return `<div class="head"><div><h1>Vehicles</h1><div class="sub">${db.vehicles.length} in your fleet</div></div>
    <div class="tools"><button class="btn ghost" data-types>Types</button><button class="btn" data-new-vehicle>${I.plus}Add vehicle</button></div></div>
  <div class="chips"><button class="chip ${typeFilter ? '' : 'on'}" data-type="">All</button>${db.types.map(t => `<button class="chip ${typeFilter === t.id ? 'on' : ''}" data-type="${t.id}">${esc(t.name)}</button>`).join('')}</div>
  <div class="grid">${list.map(v => { const h = health(v); return `<div class="card vcard" data-vehicle="${v.id}">
    <div class="vtop"><div><b>${vtag(v)}</b><div class="meta">${esc(typeName(v.typeId))} · ${esc(v.plate)}</div></div>${healthPill(h)}</div>
    <div class="meta">${esc(v.model)}</div>
    <div class="vfoot">${fuelBar(v.fuel)}${capLabel(v)}</div></div>`; }).join('') || '<div class="card empty">No vehicles of this type.</div>'}</div>`;

/* ---- Dialogs ---- */
const dlg = $('#dlg');
const open = html => { dlg.innerHTML = `<div class="dlg">${html}</div>`; if (!dlg.open) dlg.showModal(); };
const close = () => dlg.open && dlg.close();
const field = (label, name, val = '', type = 'text', extra = '') => `<label>${label}<input name="${name}" type="${type}" value="${esc(val)}" ${extra}></label>`;
const blank = () => ({ title: '', customer: '', address: '', date: day, start: '09:00', end: '10:00', kind: 'people', passengers: 1, cargoKg: '', distance: '', driverId: '', vehicleId: '', revenue: true, hireDocs: 'none', notes: '' });

function tripForm(a) {

  open(`<h2>${a.id ? 'Edit trip' : 'New trip'}</h2>
  <form id="f-trip" data-id="${a.id || ''}">
    <div id="warn"></div>
    ${field('Trip name', 'title', a.title, 'text', 'required')}
    <div class="g2">${field('Customer', 'customer', a.customer)}${field('Address', 'address', a.address)}</div>
    <div class="g3">${field('Date', 'date', a.date, 'date', 'required')}${field('Start', 'start', a.start, 'time', 'required')}${field('End', 'end', a.end, 'time', 'required')}</div>
    <input type="hidden" name="kind" value="${a.kind}">
    <div class="seg" id="kindseg" style="margin-bottom:14px"><button type="button" data-kind="people" class="${a.kind === 'people' ? 'on' : ''}">People</button><button type="button" data-kind="cargo" class="${a.kind === 'cargo' ? 'on' : ''}">Cargo</button></div>
    <div class="g3">
      <label data-for="people" ${a.kind === 'cargo' ? 'hidden' : ''}>How many people<input name="passengers" type="number" min="0" value="${esc(a.passengers)}"></label>
      <label data-for="cargo" ${a.kind === 'cargo' ? '' : 'hidden'}>Weight (kg)<input name="cargoKg" type="number" min="0" value="${esc(a.cargoKg)}"></label>
      ${field('Distance (km)', 'distance', a.distance, 'number', 'min="0"')}
      <label>Driver<select name="driverId">${driverOpts}</select></label></div>
    <div class="g2"><label>Hire contract with the hiring company<select name="hireDocs">${[['none', 'Not needed'], ['waiting', 'Being prepared'], ['received', 'Signed and ready']].map(([k, l]) => `<option value="${k}" ${a.hireDocs === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="check" style="align-self:end;padding-bottom:12px"><input type="checkbox" name="revenue" ${a.revenue !== false ? 'checked' : ''}>Customer pays for this trip</label></div>
    <label style="margin-bottom:8px">Vehicle</label>
    <input type="hidden" name="vehicleId" value="${a.vehicleId || ''}">
    <div class="vpick" id="vpick"></div>
    <label>Notes<textarea name="notes" rows="2">${esc(a.notes)}</textarea></label>
    <div class="actions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn">Save</button></div>
  </form>`);

  if (!m.length) {

    const { error } = await sb.rpc('create_company', { company_name: name });

function runSplash(done) {
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  splashEl.className = ''; splashEl.innerHTML = splashHtml(); splashEl.hidden = false;
  let over = false, timer = 0;
  const end = () => {
    if (over) return; over = true; clearTimeout(timer); document.removeEventListener('keydown', onKey);
    splashEl.classList.add('out');
    setTimeout(() => { splashEl.hidden = true; splashEl.innerHTML = ''; if (done) done(); }, 500);
  };
  const onKey = e => { if (e.key === 'Escape' || e.key === 'Enter') end(); };
  document.addEventListener('keydown', onKey);
  splashEl.addEventListener('click', e => { if (e.target.closest('.sp-skip')) { e.stopPropagation(); track('splash_skipped'); end(); } });
  timer = setTimeout(end, reduce ? 1200 : 3000);
}
function startLanding(withSplash) {
  showLanding(); track('landing_viewed');
  let seen = '1'; try { seen = sessionStorage.getItem('dbeat.splash'); } catch {}

}

    track('trip_ended'); a.status = 'completed'; a.endedAt = hhmm(); (a.phaseLog ||= []).push({ p: 'end', at: Date.now() }); if (v && f.fuel !== undefined) v.fuel = +f.fuel;
  } else if (form.id === 'f-renew') {
    const v = vehicle(form.dataset.vid), k = form.dataset.key;
    v.docState = v.docState || {};
    if (form.dataset.mode === 'start') v.docState[k] = { inProcess: true, expected: f.expected || '', note: (f.note || '').trim() };
    else { v.docs = v.docs || {}; v.docs[k] = f.until; delete v.docState[k]; }
  } else if (form.id === 'f-driver') {
    const old = id ? driver(id) : {}, checked = 'idChecked' in f;
    const rec = { name: f.name.trim(), phone: f.phone.trim(), homeAddress: f.homeAddress.trim(), licenseNumber: f.licenseNumber.trim(), licenseClass: f.licenseClass.trim(), licenseExpiry: f.licenseExpiry, idType: f.idType, idNumber: f.idNumber.trim(), idChecked: checked, idCheckedDate: checked ? (old.idChecked ? old.idCheckedDate : today()) : '', active: 'active' in f };
    if (id) Object.assign(old, rec); else db.drivers.push({ ...rec, id: uid() });
  } else if (form.id === 'f-vehicle') {
    const rec = { name: f.name.trim(), typeId: f.typeId, model: f.model.trim(), plate: f.plate.trim(), seats: +f.seats || 1, capacity: +f.capacity || 0, fuel: +f.fuel, range: +f.range || 1, driverId: f.driverId, maintenance: 'maintenance' in f, docs: Object.fromEntries(DOCS.map(([k]) => [k, f['doc_' + k]])), docState: Object.fromEntries(DOCS.filter(([k]) => 'proc_' + k in f).map(([k]) => [k, { inProcess: true, expected: f['exp_' + k] || '', note: (id && vehicle(id).docState?.[k]?.note) || '' }])) };
    if (id) Object.assign(vehicle(id), rec); else db.vehicles.push({ ...rec, id: uid() });
  } else if (form.id === 'f-type') {
    db.types.push({ id: uid(), name: f.name.trim(), kind: f.kind, seats: +f.seats || 1, capacity: +f.capacity || 1000 }); save(); typesDialog(); render(); return;
  }
  save(); close(); render();
});
dlg.addEventListener('close', () => { dlg.innerHTML = ''; });
document.documentElement.lang = lang;
document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
syncTheme();
init();
</script>
